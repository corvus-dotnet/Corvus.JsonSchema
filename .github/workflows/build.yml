name: build
on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      forcePublish:
        description: When true the Publish stage will always be run, otherwise it only runs for tagged versions.
        required: false
        default: false
        type: boolean
      forcePublicNugetDestination:
        description: When true the NuGet Publish destination will always be set to nuget.org. (Force publishing normally publishes to GitHub Packages, if not tagged version)
        required: false
        default: false
        type: boolean
      skipCleanup:
        description: When true the pipeline clean-up stage will not be run. For example, the cache used between pipeline stages will be retained.
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  actions: write  # enable cache clean-up
  checks: write  # enable test result annotations
  contents: write  # enable creating releases and GitHub Pages branch deployment
  id-token: write  # enable OIDC authentication
  issues: read
  packages: write  # enable publishing packages
  pages: write  # enable GitHub Pages environment
  pull-requests: write  # enable test result annotations and PR preview comments

jobs:
  prepareConfig:
    name: Prepare Configuration
    runs-on: ubuntu-latest
    outputs:
      RESOLVED_ENV_VARS: ${{ steps.prepareEnvVarsAndSecrets.outputs.environmentVariablesYamlBase64 }}
      RESOLVED_SECRETS: ${{ steps.prepareEnvVarsAndSecrets.outputs.secretsYamlBase64 }}
    steps:
    # Declare any environment variables and/or secrets that need to be available inside the build process
    - uses: endjin/Endjin.RecommendedPractices.GitHubActions/actions/prepare-env-vars-and-secrets@main
      id: prepareEnvVarsAndSecrets
      with:
        environmentVariablesYaml: |
          ZF_NUGET_PUBLISH_SOURCE: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.forcePublicNugetDestination == 'true') && 'https://api.nuget.org/v3/index.json' || format('https://nuget.pkg.github.com/{0}/index.json', github.repository_owner) }}
          BUILDVAR_BuildWebsite: "false"
          BUILDVAR_IsPreviewDeployment: "${{ github.event_name == 'pull_request' }}"
          BUILDVAR_BasePathPrefix: "${{ github.event_name == 'pull_request' && format('/{0}/pr-preview/pr-{1}', github.event.repository.name, github.event.pull_request.number) || format('/{0}', github.event.repository.name) }}"
        secretsYaml: |
          NUGET_API_KEY: "${{ startsWith(github.ref, 'refs/tags/') && secrets.NUGET_APIKEY || secrets.BUILD_PUBLISHER_PAT }}"
          # TODO: Review approach to enable Vellum to be downloaded
          VELLUM_DOWNLOAD_TOKEN: "${{ secrets.ENDJIN_PACKAGES_TOKEN }}"
        secretsEncryptionKey: ${{ secrets.SHARED_WORKFLOW_KEY }}

  setCachePathsConfig:
    name: Set Cache Paths
    runs-on: ubuntu-latest
    env:
      BASE_CACHE_PATHS: |
        .nuget-packages
        Solutions
        solutions
      # The reusable workflow has the above paths built-in so we don't need to pass them
      ADDITIONAL_CACHE_PATHS: |
        JSON-Schema-Test-Suite
        JMESPath-Test-Suite
        Jsonata-Test-Suite
        yaml-test-suite
        tests/json-patch-tests
        jsonpath-compliance-test-suite
        toon-format-spec
        docs/website/.endjin
        docs/website/.output
        **/bin
        **/obj
        .zf
    outputs:
      # This is consumed by the reusable workflow
      additionalCachePaths: ${{ steps.additionalCachePaths.outputs.additionalCachePaths }}
      # This is consumed by other jobs that need to restore the cache
      allCachePaths: ${{ steps.allCachePaths.outputs.allCachePaths }}
    steps:
      - id: additionalCachePaths
        name: Store Additional Cache Paths
        run: |
          {
            echo "additionalCachePaths<<EOF"
            echo "$ADDITIONAL_CACHE_PATHS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - id: allCachePaths
        name: Store All Cache Paths
        run: |
          {
            echo "allCachePaths<<EOF"
            echo "$BASE_CACHE_PATHS"
            echo "$ADDITIONAL_CACHE_PATHS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs:
      - prepareConfig
      - setCachePathsConfig
    uses: endjin/Endjin.RecommendedPractices.GitHubActions/.github/workflows/scripted-build-matrix-pipeline.yml@main
    with:
      testPhaseMatrixJson: |
          {
            "os": ["ubuntu-latest", "windows-latest"],
            "dotnetFramework": ["net10.0", "net481"],
            "exclude": [
              {
                "os": "ubuntu-latest",
                "dotnetFramework": "net481"
              }
            ]
          }
      compilePhaseRunnerOs: ubuntu-latest
      packagePhaseRunnerOs: ubuntu-latest
      netSdkVersion: '10.0.x'
      additionalNetSdkVersion: |
        8.0.x
        9.0.x
      # workflow_dispatch inputs are always strings, the type property is just for the UI
      forcePublish: ${{ github.event.inputs.forcePublish == 'true' }}
      skipCleanup: ${{ github.event.inputs.skipCleanup == 'true' }}
      # testArtifactName: ''
      # testArtifactPath: ''
      compilePhaseEnv: ${{ needs.prepareConfig.outputs.RESOLVED_ENV_VARS }}
      testPhaseEnv: ${{ needs.prepareConfig.outputs.RESOLVED_ENV_VARS }}
      packagePhaseEnv: ${{ needs.prepareConfig.outputs.RESOLVED_ENV_VARS }}
      publishPhaseEnv: ${{ needs.prepareConfig.outputs.RESOLVED_ENV_VARS }}
      additionalCachePaths: ${{ needs.setCachePathsConfig.outputs.additionalCachePaths }}
      # Build the documentation website in a parallel post-compile job
      postCompilePhaseTasks: BuildWebsite
      postCompileRunnerOs: ubuntu-latest
      postCompilePhaseEnv: ${{ needs.prepareConfig.outputs.RESOLVED_ENV_VARS }}
      postCompileArtifactName: website-output
      postCompileArtifactPath: docs/website/.output
    secrets:
      compilePhaseAzureCredentials: ${{ secrets.AZURE_READER_CREDENTIALS }}
      compilePhaseSecrets: ${{ needs.prepareConfig.outputs.RESOLVED_SECRETS }}
      # testPhaseAzureCredentials: ${{ secrets.TESTS_KV_READER_CREDENTIALS }}
      # packagePhaseAzureCredentials: ${{ secrets.AZURE_PUBLISH_CREDENTIALS }}
      # publishPhaseAzureCredentials: ${{ secrets.AZURE_PUBLISH_CREDENTIALS }}
      # testPhaseSecrets: ${{ needs.prepareConfig.outputs.RESOLVED_SECRETS }}
      # packagePhaseSecrets: ${{ needs.prepareConfig.outputs.RESOLVED_SECRETS }}
      publishPhaseSecrets: ${{ needs.prepareConfig.outputs.RESOLVED_SECRETS }}
      postCompilePhaseSecrets: ${{ needs.prepareConfig.outputs.RESOLVED_SECRETS }}
      secretsEncryptionKey: ${{ secrets.SHARED_WORKFLOW_KEY }}

  integration-tests:
    name: Integration Tests (${{ matrix.suite }})
    needs:
      - build
      - setCachePathsConfig
    runs-on: ubuntu-latest
    # Two legs on separate runners. The AsyncApi broker suite ("brokers") starts the heaviest containers in the
    # repo - the Azure Service Bus emulator with its auto-provisioned MSSQL sidecar, plus Kafka - and needs a
    # runner to itself, which is exactly how main runs it (a single-project run). The Arazzo durability/directory
    # backends ("backends") each start their own Testcontainers backend. Running both sets together as one
    # whole-solution sweep on a single 2-core runner starved the Service Bus emulator until it never became ready
    # and the job hung to its timeout, so each set gets its own runner. fail-fast: false so one leg failing still
    # lets the other report.
    strategy:
      fail-fast: false
      matrix:
        suite:
          - brokers
          - backends
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Restore build cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .nuget-packages
            Solutions
            solutions
            ${{ needs.setCachePathsConfig.outputs.additionalCachePaths }}
          key: build-state-${{ github.run_id }}-compile
          enableCrossOsArchive: true

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      # The "Restore build cache" above is only a best-effort speed-up: this job runs after the whole `build`
      # workflow, by which point the run-scoped `-compile` cache has often been LRU-evicted under GitHub's per-repo
      # cache limit, so the test assemblies can be absent. Each leg therefore builds what it runs; on a cache hit
      # these are incremental no-ops.
      - name: Build the broker integration test project
        if: matrix.suite == 'brokers'
        run: |
          dotnet build tests/Corvus.Text.Json.AsyncApi.Transport.IntegrationTests/Corvus.Text.Json.AsyncApi.Transport.IntegrationTests.csproj \
            -f net10.0 \
            -c Release
        timeout-minutes: 15
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-packages

      - name: Build the Arazzo backend integration test projects
        if: matrix.suite == 'backends'
        # Build the whole solution so every Arazzo integration test assembly is on disk before the run: the run
        # targets them by --test-modules glob, and a glob silently matches nothing for an assembly that was not
        # built - a false green. On a cache hit this is incremental.
        run: |
          dotnet build Corvus.Text.Json.slnx -c Release
        timeout-minutes: 30
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-packages

      - name: Run broker integration tests
        if: matrix.suite == 'brokers'
        # The AsyncApi broker transports (RabbitMQ, Kafka, MQTT, NATS, WebSocket, Azure Service Bus emulator), run
        # in isolation on this leg's runner - the same single-project invocation main uses.
        run: |
          dotnet-coverage collect \
            --output integration-tests.cobertura.xml \
            --output-format cobertura \
            -s dotnet-coverage.settings.xml \
            "dotnet test --project tests/Corvus.Text.Json.AsyncApi.Transport.IntegrationTests/Corvus.Text.Json.AsyncApi.Transport.IntegrationTests.csproj \
              -f net10.0 \
              -c Release \
              --no-build \
              --filter TestCategory=integration&TestCategory!=failing \
              --report-trx --report-trx-filename integration-tests.trx"
        timeout-minutes: 25
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-packages

      - name: Run Arazzo backend integration tests
        if: matrix.suite == 'backends'
        # Every Arazzo durability/directory backend that carries an integration test (Postgres, SQL Server, MySQL,
        # Redis, MongoDB, NATS JetStream, Azure Storage, ...), each spinning its own Testcontainers backend.
        # --test-modules targets the built Arazzo test assemblies by glob: the broker suite above never runs here,
        # and an unbuilt module is simply skipped rather than failing the run with exit 129 as a --solution sweep
        # would. --max-parallel-test-modules 1 gives each backend the whole runner; --ignore-exit-code 8 tolerates
        # the Arazzo test assemblies that carry no integration-categorised tests. Cosmos (heavy emulator, run on
        # demand with --filter TestCategory=cosmos) and azure (live-cloud, run in the azure-e2e job) are excluded.
        run: |
          dotnet test --test-modules "**/bin/Release/net10.0/Corvus.Text.Json.Arazzo.*.Tests.dll" \
            --max-parallel-test-modules 1 \
            --ignore-exit-code 8 \
            --filter "TestCategory=integration&TestCategory!=failing&TestCategory!=cosmos&TestCategory!=azure" \
            --report-trx --report-trx-filename integration-tests.trx
        timeout-minutes: 45
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-packages

      - name: Publish Test Results
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2.7.0
        if: always()
        with:
          name: Integration Test Results (${{ matrix.suite }})
          path: '**/integration-tests.trx'
          reporter: dotnet-trx

  arazzo-samples:
    name: Arazzo Samples
    needs:
      - setCachePathsConfig
    runs-on: ubuntu-latest
    # samples/arazzo is NOT in Corvus.Text.Json.slnx, so the matrix build above compiles none of it and the main test
    # sweep runs none of its tests. Without this job a change under samples/arazzo can break the build and every one of
    # its tests can rot, while every gate reports green -- which is exactly what happened: a test added in this repo had
    # never compiled, and three more had been failing since a scope was added without updating them.
    #
    # No `needs: build`: this job builds what it runs, so it reports a genuine break rather than being skipped by an
    # unrelated matrix failure. The tests here are unit tests and need no containers; the demo's container-backed
    # scenarios are exercised by the AppHost, which is not run in CI.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Restore build cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .nuget-packages
            Solutions
            solutions
            ${{ needs.setCachePathsConfig.outputs.additionalCachePaths }}
          key: build-state-${{ github.run_id }}-compile
          enableCrossOsArchive: true

      - name: Build the Arazzo samples solution
        run: |
          dotnet build samples/arazzo/Corvus.Text.Json.Arazzo.ControlPlane.Demo.slnx -c Release
        timeout-minutes: 30
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-packages

      - name: Run the Arazzo samples tests
        # Same category exclusions as the main sweep. --ignore-exit-code 8 tolerates a sample test assembly that
        # carries no matching tests, exactly as the main sweep does.
        run: |
          dotnet test --solution samples/arazzo/Corvus.Text.Json.Arazzo.ControlPlane.Demo.slnx \
            -c Release \
            --no-build \
            --filter "TestCategory!=outerloop&TestCategory!=failing&TestCategory!=integration" \
            --ignore-exit-code 8 \
            --report-trx --report-trx-filename arazzo-samples-tests.trx
        timeout-minutes: 25
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-packages

      - name: Publish Test Results
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2.7.0
        if: always()
        with:
          name: Arazzo Samples Test Results
          path: '**/arazzo-samples-tests.trx'
          reporter: dotnet-trx

  azure-e2e:
    name: Azure E2E (Checkpoint Listener)
    # No `needs: build`. This job is self-contained — it builds its own AOT feed and test project — so it runs
    # independently rather than being gated on (and skipped by) unrelated failures in the matrix build (packaging,
    # net481, or the website). Its own build step still catches a genuine compile break.
    # Dormant until a maintainer opts in: set the repository variable RUN_AZURE_E2E to 'true' AND provision the
    # secrets below. Left off, this job is skipped, so it never runs before its Azure identity exists. It is heavy
    # (it builds the AOT feed + builder image, deploys a Container App, and provisions a Flex Function App), which is
    # acceptable because full CI runs happen only at release time.
    #
    # Required to enable:
    #   Repository variable RUN_AZURE_E2E = 'true'
    #   Secrets (an OIDC federated service principal with Contributor on the test resource group):
    #     AZURE_TESTS_E2E_CLIENT_ID, AZURE_TESTS_E2E_TENANT_ID, AZURE_TESTS_E2E_SUBSCRIPTION_ID
    #     ARAZZO_AZURE_RESOURCE_GROUP  (the test resource group; nothing is committed)
    #   Optional variable ARAZZO_AZURE_LOCATION (defaults to uksouth).
    if: ${{ vars.RUN_AZURE_E2E == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC login to Azure
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget-packages
      ARAZZO_AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_TESTS_E2E_SUBSCRIPTION_ID }}
      ARAZZO_AZURE_RESOURCE_GROUP: ${{ secrets.ARAZZO_AZURE_RESOURCE_GROUP }}
      ARAZZO_AZURE_LOCATION: ${{ vars.ARAZZO_AZURE_LOCATION }}
      # Use Docker on the GitHub-hosted runner (it runs a root daemon, natively available), not rootless podman:
      # podman's `build` RUN steps fail under crun on Actions. ARAZZO_CONTAINER_CLI switches the AOT builder image
      # build and the in-container AOT build to docker; Testcontainers and LocalStack use the default docker socket,
      # so DOCKER_HOST is left unset.
      ARAZZO_CONTAINER_CLI: docker
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Build the AOT builder image and the local package feed
        shell: pwsh
        run: |
          $version = "5.0.0-local.$($env:GITHUB_RUN_NUMBER)"
          "ARAZZO_AOT_RUNTIME_VERSION=$version" >> $env:GITHUB_ENV
          "ARAZZO_AOT_LOCAL_FEED=$($env:GITHUB_WORKSPACE)/local-packages" >> $env:GITHUB_ENV
          ./src/Corvus.Text.Json.Arazzo.Durability.Aot/build-aot-builder-image.ps1 -ContainerCli docker
          ./build-local-packages.ps1 -Version $version
        timeout-minutes: 60

      - name: Build the test project
        run: |
          dotnet build tests/Corvus.Text.Json.Arazzo.Durability.ControlPlane.Server.Tests/Corvus.Text.Json.Arazzo.Durability.ControlPlane.Server.Tests.csproj \
            -f net10.0 -c Release
        timeout-minutes: 30

      # Log in to Azure right before the management-plane work, not before the ~40-minute feed build: a federated
      # OIDC session cannot refresh its token, so authenticating here keeps it valid across the deploy, the SDK-based
      # Flex tests (AzureCliCredential), and the teardown, rather than aging out during the build.
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_TESTS_E2E_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TESTS_E2E_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_TESTS_E2E_SUBSCRIPTION_ID }}

      - name: Deploy the checkpoint listener
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'listener-deploy-state.json'
          ./samples/arazzo/Corvus.Text.Json.Arazzo.ServerlessCheckpointListener/deploy/Deploy-CheckpointListener.ps1 -StateFile $state
          $s = Get-Content -Raw $state | ConvertFrom-Json
          "ARAZZO_CHECKPOINT_LISTENER_URL=$($s.listenerUrl)" >> $env:GITHUB_ENV
          Write-Output "::add-mask::$($s.checkpointSecret)"
          "ARAZZO_CHECKPOINT_SECRET=$($s.checkpointSecret)" >> $env:GITHUB_ENV
          Write-Output "::add-mask::$($s.storageConnection)"
          "ARAZZO_CHECKPOINT_STORAGE=$($s.storageConnection)" >> $env:GITHUB_ENV
        timeout-minutes: 20

      - name: Run Azure E2E tests
        run: |
          dotnet test tests/Corvus.Text.Json.Arazzo.Durability.ControlPlane.Server.Tests/Corvus.Text.Json.Arazzo.Durability.ControlPlane.Server.Tests.csproj \
            -f net10.0 -c Release --no-build \
            --filter "TestCategory=azure&TestCategory!=failing" \
            --report-trx --report-trx-filename azure-e2e-tests.trx
        timeout-minutes: 40

      - name: Tear down the checkpoint listener
        if: always()
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'listener-deploy-state.json'
          if (Test-Path $state) {
            ./samples/arazzo/Corvus.Text.Json.Arazzo.ServerlessCheckpointListener/deploy/Remove-CheckpointListener.ps1 -StateFile $state
          }
        # The Container Apps environment delete alone takes ~15 minutes; give the whole teardown headroom so it does
        # not get killed mid-delete (which orphaned the Log Analytics workspace on a 20-minute limit).
        timeout-minutes: 40

      - name: Publish Test Results
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2.7.0
        if: always()
        with:
          name: Azure E2E Test Results
          path: '**/azure-e2e-tests.trx'
          reporter: dotnet-trx

  deploy-docs:
    name: Deploy Documentation
    needs:
      - build
    # The prod documentation site should only ever be updated, by this build, from stable release tags
    if: github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://corvus-oss.org/Corvus.JsonSchema/
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download website artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: website-output
          path: docs/website/.output

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f   # v4.8.0
        with:
          branch: gh-pages
          folder: docs/website/.output
          clean-exclude: pr-preview

  deploy-preview:
    name: Deploy PR Preview
    needs:
      - build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency: preview-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download website artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: website-output
          path: docs/website/.output

      - name: Ensure .nojekyll on gh-pages
        run: |
          if ! git fetch origin gh-pages 2>/dev/null || \
             ! git show origin/gh-pages:.nojekyll >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages 2>/dev/null || git checkout --orphan gh-pages
            git worktree add /tmp/gh-pages gh-pages
            cd /tmp/gh-pages
            rm -f _config.yml
            touch .nojekyll
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit --amend --no-edit
            git push origin gh-pages --force-with-lease
            cd -
            git worktree remove /tmp/gh-pages
          fi

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9  # v1.8.1
        with:
          source-dir: docs/website/.output
          umbrella-dir: pr-preview
          pages-base-url: corvus-oss.org/Corvus.JsonSchema