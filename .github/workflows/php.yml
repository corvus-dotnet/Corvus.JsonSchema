name: php
on:
  push:
    branches:
    - main
    paths:
    - 'src-php/**'
    - 'src-rs/corvus-json-schema/**'
    - 'JSON-Schema-Test-Suite'
    - '.github/workflows/php.yml'
    - '.github/workflows/php-build.yml'
    - '.github/workflows/php-publish.yml'
    - 'LICENSE'
  pull_request:
    paths:
    - 'src-php/**'
    - 'src-rs/corvus-json-schema/**'
    - 'JSON-Schema-Test-Suite'
    - '.github/workflows/php.yml'
    - '.github/workflows/php-build.yml'
    - '.github/workflows/php-publish.yml'
    - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's run is superseded by the run for its next push; pushes to main are grouped by commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: corvus_json_schema (lint, package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-php/corvus-json-schema
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          sparse-checkout: |
            src-php
            src-rs/corvus-json-schema
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - name: Toolchain
        # The version pinned in src-rs/rust-toolchain.toml (clippy's lints change between releases).
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
          # bindgen's libclang and the clang whose headers it reads must be one version of LLVM. The runner image
          # carries several (ubuntu-26.04: 20, 21 and 22), and left alone bindgen loads the newest libclang with the
          # headers of the default clang, which call builtins the newer one has dropped. Take the newest that has both.
          if [ "$RUNNER_OS" = Linux ]; then
            for d in $(ls -d /usr/lib/llvm-* | sort -V -r); do
              if ls "$d"/lib/libclang*.so* >/dev/null 2>&1 && [ -x "$d/bin/clang" ]; then
                echo "LIBCLANG_PATH=$d/lib" >> "$GITHUB_ENV"
                echo "CLANG_PATH=$d/bin/clang" >> "$GITHUB_ENV"
                echo "bindgen reads with $d"
                break
              fi
            done
          fi
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Package
        # The packaged LICENSE must match the repository's; composer.json is what Packagist and PIE read.
        run: |
          cmp ../../LICENSE LICENSE
          composer validate --strict --no-check-publish

  build:
    name: build
    uses: ./.github/workflows/php-build.yml
