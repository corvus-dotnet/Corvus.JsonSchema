name: PR Preview Cleanup
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup-preview:
    name: Clean up PR Preview
    # Fork PRs never get a preview deployed (see deploy-preview in build.yml), and their
    # read-only GITHUB_TOKEN could not push the removal commit to gh-pages anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency: preview-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2

      - name: Remove PR preview
        # gh-pages holds one commit, which every write replaces (.github/scripts/Update-GhPages.ps1 says why).
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          $open = gh pr list --repo $env:GITHUB_REPOSITORY --state open --limit 1000 --json number --jq '[.[].number]|join(",")'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the open pull requests.' }
          ./.github/scripts/Update-GhPages.ps1 -Mode RemovePreview -PullRequest $env:PR -OpenPullRequests "$open"
          ./.github/scripts/Set-PreviewComment.ps1 -PullRequest $env:PR -Body "The documentation preview for this pull request has been removed." -OnlyIfExists