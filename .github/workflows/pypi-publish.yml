name: pypi-publish
# Publishes the Python packages to PyPI when the version in a package's pyproject.toml is not there yet, then tags the
# commit: corvus-json-schema (src-py/corvus-json-schema, pure Python) as py-v<version>, and corvus-json-schema-rs
# (src-py/corvus-json-schema-rs, the Rust-backed wheels) as py-rs-v<version>. To release, bump "version" in the
# package's pyproject.toml (and its __version__) and merge. A merged pull request labelled no_release publishes nothing
# (.github/actions/no-release-label).
#
# It authenticates with PyPI trusted publishing (OIDC): no token is stored. Each project's trusted publisher on PyPI
# names this repository, this workflow file and an environment: "pypi" for corvus-json-schema, "pypi-rs" for
# corvus-json-schema-rs (PyPI refuses two pending publishers with the same repository, workflow and environment), so
# keep the file and environment names. A trusted publisher can be added before the project exists (a "pending"
# publisher), so the first version is published by this workflow too (docs/ReleaseProcess.md).
#
# There is no staged approval: the upload makes the version live, and a published version can be yanked but its files
# never replaced. Every pull request that touches src-py builds and tests the same artifacts (python.yml).
#
# It is deliberately not triggered by tags: build.yml publishes NuGet packages for the tags that trigger it. The tags
# are pushed with GITHUB_TOKEN, which does not start other workflows.
on:
  push:
    branches:
    - main
    paths:
    - 'src-py/corvus-json-schema/pyproject.toml'
    - 'src-py/corvus-json-schema-rs/pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  versions:
    name: Versions to publish
    permissions:
      contents: read
      pull-requests: read  # the merged pull request's labels (no_release)
    # A manual run from another branch must not publish that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      pure: ${{ steps.check.outputs.pure }}
      pure-version: ${{ steps.check.outputs.pure-version }}
      rs: ${{ steps.check.outputs.rs }}
      rs-version: ${{ steps.check.outputs.rs-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            src-py
            .github/actions
      - name: Check for the no_release label
        id: label
        uses: ./.github/actions/no-release-label
        with:
          token: ${{ github.token }}
          event-name: ${{ github.event_name }}
          sha: ${{ github.sha }}
      - name: Check which versions PyPI does not have
        id: check
        # A merged pull request labelled no_release publishes nothing (the build and publish jobs need this output).
        if: steps.label.outputs.no-release != 'true'
        run: |
          # PyPI answers 404 for a project or version it does not have.
          check() {
            local key=$1 name=$2 file=$3
            local version
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$file" | head -n 1)
            if [ -z "$version" ]; then
              echo "::error::No version in $file."
              exit 1
            fi
            local status
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$version/json")
            echo "$key-version=$version" >> "$GITHUB_OUTPUT"
            case "$status" in
              200) echo "$key=false" >> "$GITHUB_OUTPUT"
                   echo "::notice::$name $version is already on PyPI; nothing to publish." ;;
              404) echo "$key=true" >> "$GITHUB_OUTPUT" ;;
              *)   echo "::error::PyPI answered $status for $name $version."
                   exit 1 ;;
            esac
          }
          check pure corvus-json-schema src-py/corvus-json-schema/pyproject.toml
          check rs corvus-json-schema-rs src-py/corvus-json-schema-rs/pyproject.toml

  pure-build:
    name: Build corvus-json-schema
    needs: versions
    if: needs.versions.outputs.pure == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-py/corvus-json-schema
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: src-py
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - name: Build
        # The packaged LICENSE must match the repository's (python.yml checks __version__ against pyproject.toml).
        run: |
          cmp ../../LICENSE LICENSE
          uv build
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure
          path: src-py/corvus-json-schema/dist/*

  rs-build:
    name: Build corvus-json-schema-rs
    needs: versions
    if: needs.versions.outputs.rs == 'true'
    uses: ./.github/workflows/python-wheels.yml

  pure-publish:
    name: Publish corvus-json-schema
    needs: [versions, pure-build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/corvus-json-schema/${{ needs.versions.outputs.pure-version }}/
    permissions:
      contents: write  # push the py-v<version> tag
      id-token: write  # PyPI trusted publishing
    steps:
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pure
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/py-v${{ needs.versions.outputs.pure-version }}" -f sha="${{ github.sha }}"

  rs-publish:
    name: Publish corvus-json-schema-rs
    needs: [versions, rs-build]
    runs-on: ubuntu-latest
    environment:
      name: pypi-rs
      url: https://pypi.org/project/corvus-json-schema-rs/${{ needs.versions.outputs.rs-version }}/
    permissions:
      contents: write  # push the py-rs-v<version> tag
      id-token: write  # PyPI trusted publishing
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Download the sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - name: Check the artifacts
        # Seven wheels (one per platform) and the sdist, all of this version.
        run: |
          ls -l dist
          version="${{ needs.versions.outputs.rs-version }}"
          [ "$(ls dist/corvus_json_schema_rs-$version-*.whl | wc -l)" -eq 7 ]
          [ -f "dist/corvus_json_schema_rs-$version.tar.gz" ]
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/py-rs-v${{ needs.versions.outputs.rs-version }}" -f sha="${{ github.sha }}"
