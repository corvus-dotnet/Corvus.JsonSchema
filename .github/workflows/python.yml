name: python
on:
  push:
    branches:
    - main
    paths:
    - 'src-py/**'
    - 'src-rs/corvus-json-schema/**'
    - 'JSON-Schema-Test-Suite'
    - 'src/Corvus.Text.Json/metaschema/**'
    - '.github/workflows/python.yml'
    - 'LICENSE'
  pull_request:
    paths:
    - 'src-py/**'
    - 'src-rs/corvus-json-schema/**'
    - 'JSON-Schema-Test-Suite'
    - 'src/Corvus.Text.Json/metaschema/**'
    - '.github/workflows/python.yml'
    - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's run is superseded by the run for its next push; pushes to main are grouped by commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pure:
    name: corvus-json-schema (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: src-py/corvus-json-schema
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          # Only what the packages need (the repository's generated benchmark models have paths too long for Windows).
          sparse-checkout: |
            src-py
            src-rs/corvus-json-schema
            JSON-Schema-Test-Suite
      - name: Checkout JSON-Schema-Test-Suite
        working-directory: .
        run: git submodule update --init --depth 1 JSON-Schema-Test-Suite
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install
        run: uv pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: JSON-Schema-Test-Suite
        run: |
          python tests/suite.py
          python tests/suite.py --module
          python tests/suite.py --collect basic
          python tests/suite.py --collect detailed
          python tests/suite.py --collect verbose
          python tests/annotations.py

  pure-checks:
    name: corvus-json-schema (lint, types, package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-py/corvus-json-schema
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            src-py
            src-rs/corvus-json-schema
            JSON-Schema-Test-Suite
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
          activate-environment: true
      - name: Install
        run: uv pip install -e . --group dev
      - name: Check the embedded metaschemas are current
        run: |
          python scripts/embed_metaschemas.py
          git diff --exit-code -- src/corvus_json_schema/_metaschemas.py
      - name: Lint
        run: |
          ruff check src tests bench scripts
          ruff format --check src tests bench scripts
      - name: Types
        run: |
          mypy
          pyright
      - name: Package
        # The packaged LICENSE must match the repository's.
        run: |
          cmp ../../LICENSE LICENSE
          uv build
          ls -l dist

  binding:
    name: corvus-json-schema-rs (build and test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          # Only what the packages need (the repository's generated benchmark models have paths too long for Windows).
          sparse-checkout: |
            src-py
            src-rs/corvus-json-schema
            JSON-Schema-Test-Suite
      - name: Checkout JSON-Schema-Test-Suite
        run: git submodule update --init --depth 1 JSON-Schema-Test-Suite
      - name: Toolchain
        # The version pinned in src-py/rust-toolchain.toml.
        working-directory: src-py
        run: |
          rustup toolchain install
          rustc --version
      - name: Format and lint
        working-directory: src-py/corvus-json-schema-rs
        env:
          PYO3_PYTHON: python3
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
          activate-environment: true
      - name: Build
        working-directory: src-py/corvus-json-schema-rs
        run: |
          cmp ../../LICENSE LICENSE
          uv pip install 'maturin>=1.15,<2' pytest
          maturin develop --release --uv
      - name: Test
        run: |
          python -m pytest -q src-py/corvus-json-schema-rs/tests
          python src-py/corvus-json-schema/tests/suite.py --impl corvus_json_schema_rs --exclude draft4/optional/zeroTerminatedFloats.json
          python src-py/corvus-json-schema/tests/suite.py --impl corvus_json_schema_rs --collect verbose --exclude draft4/optional/zeroTerminatedFloats.json
          python src-py/corvus-json-schema/tests/annotations.py --impl corvus_json_schema_rs
          CORVUS_IMPL=corvus_json_schema_rs python -m pytest -q src-py/corvus-json-schema/tests/test_results.py

  wheels:
    name: corvus-json-schema-rs wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: linux aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { name: linux x86_64 musl, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, container: 'python:3.10-alpine' }
          - { name: linux aarch64 musl, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, container: 'python:3.10-alpine' }
          - { name: macos universal2, os: macos-latest, target: universal2-apple-darwin }
          - { name: windows x64, os: windows-latest, target: x64 }
          - { name: windows arm64, os: windows-11-arm, target: aarch64 }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          # Only what the packages need (the repository's generated benchmark models have paths too long for Windows).
          sparse-checkout: |
            src-py
            src-rs/corvus-json-schema
            JSON-Schema-Test-Suite
      - name: Checkout JSON-Schema-Test-Suite
        shell: bash
        run: git submodule update --init --depth 1 JSON-Schema-Test-Suite
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: src-py/corvus-json-schema-rs
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Setup Python
        # abi3: one wheel serves every Python from 3.10, so test the oldest and the newest.
        if: ${{ !matrix.container }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.10
            3.14
      - name: Test (3.10 and 3.14)
        if: ${{ !matrix.container }}
        shell: bash
        run: |
          for v in 3.10 3.14; do
            python$v -m venv .venv-$v || py -$v -m venv .venv-$v
            py=.venv-$v/bin/python; [ -x "$py" ] || py=.venv-$v/Scripts/python.exe
            "$py" -m pip install -q pytest
            "$py" -m pip install -q --no-index --find-links src-py/corvus-json-schema-rs/dist corvus-json-schema-rs
            "$py" -m pytest -q src-py/corvus-json-schema-rs/tests
            "$py" src-py/corvus-json-schema/tests/suite.py --impl corvus_json_schema_rs --exclude draft4/optional/zeroTerminatedFloats.json
          done
      - name: Test (musl)
        if: ${{ matrix.container }}
        run: |
          docker run --rm -v "$PWD:/io" -w /io ${{ matrix.container }} sh -c '
            pip install -q pytest &&
            pip install -q --no-index --find-links src-py/corvus-json-schema-rs/dist corvus-json-schema-rs &&
            python -m pytest -q src-py/corvus-json-schema-rs/tests &&
            python src-py/corvus-json-schema/tests/suite.py --impl corvus_json_schema_rs --exclude draft4/optional/zeroTerminatedFloats.json'
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: src-py/corvus-json-schema-rs/dist/*.whl

  sdist:
    name: corvus-json-schema-rs (sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            src-py
            src-rs/corvus-json-schema
            JSON-Schema-Test-Suite
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: src-py/corvus-json-schema-rs
          command: sdist
          args: --out dist
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: src-py/corvus-json-schema-rs/dist/*.tar.gz
