name: rubygems-build
# Builds the corvus_json_schema gems: the source gem, and native gems cross-compiled with rb-sys-dock for each
# platform, each holding the extension for Ruby 3.3, 3.4 and 4.0. Each native gem is then installed and tested on its
# own platform, with the oldest and newest of those Rubies. The test also checks that the gem is the only native gem
# RubyGems would offer that Ruby, and on Linux installs it by name from an index of all the gems. The gems are
# uploaded as artifacts named gem-*. Called by ruby.yml (CI) and rubygems-publish.yml (release), so a release pushes
# exactly what was built and tested here.
on:
  workflow_call:

permissions:
  contents: read

env:
  RUBY_VERSIONS: '3.3,3.4,4.0'

jobs:
  source:
    name: corvus_json_schema source gem
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-rb/corvus-json-schema
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          sparse-checkout: |
            src-rb
            src-rs/corvus-json-schema
      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: src-rb/corvus-json-schema
      - name: Build
        # Loading the Rakefile copies the crate into ext/corvus_json_schema/vendor, which the source gem carries.
        run: |
          bundle exec rake vendor
          mkdir -p pkg
          gem build corvus_json_schema.gemspec -o "pkg/corvus_json_schema-$(ruby -Ilib -rcorvus_json_schema/version -e 'print CorvusJsonSchema::VERSION').gem"
          ls -l pkg
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-source
          path: src-rb/corvus-json-schema/pkg/*.gem
          if-no-files-found: error

  cross:
    name: corvus_json_schema gem (${{ matrix.gem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # platform is rb-sys-dock's name for the build, and gem is the platform of the gem it makes. The Rakefile
        # names the glibc gems -gnu.
        include:
          - { platform: x86_64-linux, gem: x86_64-linux-gnu }
          - { platform: aarch64-linux, gem: aarch64-linux-gnu }
          - { platform: x86_64-linux-musl, gem: x86_64-linux-musl }
          - { platform: aarch64-linux-musl, gem: aarch64-linux-musl }
          - { platform: x86_64-darwin, gem: x86_64-darwin }
          - { platform: arm64-darwin, gem: arm64-darwin }
          - { platform: x64-mingw-ucrt, gem: x64-mingw-ucrt }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          sparse-checkout: |
            src-rb
            src-rs/corvus-json-schema
      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
      - name: Cargo registry directory
        # rb-sys-dock bind-mounts ~/.cargo/registry into its container, but creates it relative to the working
        # directory (rb-sys 0.9.130), so on a fresh runner the mount fails.
        run: mkdir -p "$HOME/.cargo/registry"
      - name: Build
        # rb-sys-dock mounts the repository, so the Rakefile vendors the crate inside the container as it does here.
        uses: oxidize-rb/actions/cross-gem@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ env.RUBY_VERSIONS }}
          working-directory: src-rb/corvus-json-schema
      - name: Check the gem
        id: gem
        # The action's gem-path output looks for a gem named for the build platform, which the glibc gems are not.
        env:
          GEM_PLATFORM: ${{ matrix.gem }}
        run: |
          ls -l src-rb/corvus-json-schema/pkg
          GEM=$(ls src-rb/corvus-json-schema/pkg/corvus_json_schema-*-"$GEM_PLATFORM".gem)
          # The platform in the gem's metadata, which is what RubyGems goes by, not the file's name.
          [ "$(gem spec "$GEM" original_platform | sed -n 's/^--- //p')" = "$GEM_PLATFORM" ] \
            || { echo "::error::The metadata of $GEM does not say $GEM_PLATFORM."; exit 1; }
          echo "path=$GEM" >> "$GITHUB_OUTPUT"
          # One extension per Ruby version.
          gem spec "$GEM" files | grep -E 'lib/corvus_json_schema/[0-9]+\.[0-9]+/corvus_json_schema\.' | tee libs.txt
          for v in ${RUBY_VERSIONS//,/ }; do
            grep -q "lib/corvus_json_schema/$v/" libs.txt || { echo "::error::No extension for Ruby $v."; exit 1; }
          done
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-${{ matrix.gem }}
          path: ${{ steps.gem.outputs.path }}
          if-no-files-found: error

  test:
    name: corvus_json_schema gem test (${{ matrix.platform }}, Ruby ${{ matrix.ruby }})
    needs: [source, cross]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x86_64-linux-gnu, os: ubuntu-latest, ruby: '3.3' }
          - { platform: x86_64-linux-gnu, os: ubuntu-latest, ruby: '4.0' }
          - { platform: aarch64-linux-gnu, os: ubuntu-24.04-arm, ruby: '3.3' }
          - { platform: aarch64-linux-gnu, os: ubuntu-24.04-arm, ruby: '4.0' }
          # The musl gems are tested in the official Alpine images, run with docker (JavaScript actions do not run in
          # Alpine containers on arm64).
          - { platform: x86_64-linux-musl, os: ubuntu-latest, ruby: '3.3', image: 'ruby:3.3-alpine' }
          - { platform: x86_64-linux-musl, os: ubuntu-latest, ruby: '4.0', image: 'ruby:4.0-alpine' }
          - { platform: aarch64-linux-musl, os: ubuntu-24.04-arm, ruby: '3.3', image: 'ruby:3.3-alpine' }
          - { platform: aarch64-linux-musl, os: ubuntu-24.04-arm, ruby: '4.0', image: 'ruby:4.0-alpine' }
          - { platform: x86_64-darwin, os: macos-15-intel, ruby: '3.3' }
          - { platform: x86_64-darwin, os: macos-15-intel, ruby: '4.0' }
          - { platform: arm64-darwin, os: macos-latest, ruby: '3.3' }
          - { platform: arm64-darwin, os: macos-latest, ruby: '4.0' }
          - { platform: x64-mingw-ucrt, os: windows-latest, ruby: '3.3' }
          - { platform: x64-mingw-ucrt, os: windows-latest, ruby: '4.0' }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          sparse-checkout: |
            src-rb/corvus-json-schema/test
            JSON-Schema-Test-Suite
      - name: Checkout JSON-Schema-Test-Suite
        run: git submodule update --init --depth 1 JSON-Schema-Test-Suite
      - name: Setup Ruby
        if: ${{ !matrix.image }}
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gem-*
          path: gems
          merge-multiple: true
      - name: Install and test
        # The installed gem, not the sources: the tests run outside the gem's directory.
        env:
          IMAGE: ${{ matrix.image }}
          GEM_PLATFORM: ${{ matrix.platform }}
        run: |
          cat > test-gem.sh <<'SCRIPT'
          set -eu
          # On Windows, GITHUB_WORKSPACE is a path Ruby can open (sh's $PWD is an MSYS path); in docker it is unset.
          export JSON_SCHEMA_TEST_SUITE="${GITHUB_WORKSPACE:-$PWD}/JSON-Schema-Test-Suite"
          # Exactly one native gem of the release is for this Ruby. When two are (as a glibc gem named x86_64-linux and
          # the musl gem both were on Alpine), RubyGems before 4.0 installs either, by an ordering of its own.
          ruby -rrubygems/package -e '
            native = Dir["gems/*.gem"].map { |f| Gem::Package.new(f).spec }
            native.reject! { |s| s.platform == Gem::Platform::RUBY }
            matching = native.select { |s| Gem::Platform.match_spec?(s) }.map { |s| s.platform.to_s }
            expected = ENV["GEM_PLATFORM"]
            abort "The native gems for this Ruby are #{matching.inspect}, not only #{expected}." unless matching == [expected]'
          if [ "$(ruby -e 'print Gem::Platform.local.os')" = linux ]; then
            # As a user installs it: by name, from an index of every gem of the release, so RubyGems chooses between
            # the glibc gem, the musl gem and the source gem.
            gem install rubygems-generate_index
            mkdir -p index/gems
            cp gems/*.gem index/gems/
            (cd index && gem generate_index --directory .)
            gem install --clear-sources --source "file://$PWD/index" corvus_json_schema
          else
            gem install --local gems/corvus_json_schema-*-"$GEM_PLATFORM".gem
          fi
          gem install minitest -v '~> 5.25'
          cd src-rb/corvus-json-schema
          ruby -e 'require "corvus_json_schema"; puts CorvusJsonSchema.crate_version, $LOADED_FEATURES.grep(/corvus_json_schema\.(so|bundle|dll)/)'
          ruby -e 'require "corvus_json_schema"
            platform = Gem.loaded_specs["corvus_json_schema"].platform.to_s
            expected = ENV["GEM_PLATFORM"]
            abort "The #{platform} gem was installed, not the #{expected} one." unless platform == expected'
          ruby test/test_api.rb
          ruby test/test_suite.rb
          SCRIPT
          if [ -n "$IMAGE" ]; then
            docker run --rm -e GEM_PLATFORM -v "$PWD:/w" -w /w "$IMAGE" sh test-gem.sh
          else
            sh test-gem.sh
          fi
