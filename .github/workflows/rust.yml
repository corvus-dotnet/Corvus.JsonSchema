name: rust
on:
  push:
    branches:
    - main
    paths:
    - 'src-rs/**'
    - 'JSON-Schema-Test-Suite'
    - 'src/Corvus.Text.Json/metaschema/**'
    - '.github/workflows/rust.yml'
  pull_request:
    paths:
    - 'src-rs/**'
    - 'JSON-Schema-Test-Suite'
    - 'src/Corvus.Text.Json/metaschema/**'
    - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test corvus-json-schema (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-rs/corvus-json-schema
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
      - name: Checkout JSON-Schema-Test-Suite
        working-directory: .
        run: git submodule update --init --depth 1 JSON-Schema-Test-Suite
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
