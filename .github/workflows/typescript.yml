name: typescript
on:
  push:
    branches:
    - main
    paths:
    - 'src-ts/**'
    - 'JSON-Schema-Test-Suite'
    - 'src/Corvus.Text.Json/metaschema/**'
    - '.github/workflows/typescript.yml'
  pull_request:
    paths:
    - 'src-ts/**'
    - 'JSON-Schema-Test-Suite'
    - 'src/Corvus.Text.Json/metaschema/**'
    - '.github/workflows/typescript.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test @corvus-dotnet/json-schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-ts/corvus-json-schema
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
      - name: Checkout JSON-Schema-Test-Suite
        working-directory: .
        run: git submodule update --init --depth 1 JSON-Schema-Test-Suite
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ts/corvus-json-schema/package-lock.json
      - name: Install
        run: npm ci
      - name: Check the embedded metaschemas are current
        run: |
          npm run embed-metaschemas
          git diff --exit-code -- src/metaschemas.ts
      - name: Test
        run: npm test
      - name: Check the package packs
        # With the npm that npm-publish.yml stages with, which drops package.json fields it has to auto-correct (as it
        # once did the bin entry), so fail if `npm pkg fix` would change anything. prepack builds dist/ and copies the
        # repository LICENSE in.
        run: |
          npm install -g 'npm@^11.15.0'
          npm pkg fix
          if ! git diff --exit-code -- package.json; then
            echo "::error::npm would auto-correct package.json when publishing; run 'npm pkg fix' and commit the result."
            exit 1
          fi
          npm pack --dry-run 2>&1 | tee "$RUNNER_TEMP/pack.txt"
          grep -q ' LICENSE$' "$RUNNER_TEMP/pack.txt"
          grep -q ' dist/index.js$' "$RUNNER_TEMP/pack.txt"
          grep -q ' src/index.ts$' "$RUNNER_TEMP/pack.txt"
