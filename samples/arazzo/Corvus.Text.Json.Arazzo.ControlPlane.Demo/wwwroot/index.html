<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arazzo Control Plane</title>
  <link rel="stylesheet" href="/ui/src/arazzo-kit.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>Arazzo Control Plane</h1>
      <div class="topbar-right">
        <a class="designer-link" href="/designer" title="Open the workflow designer">✎ Designer</a>
        <arazzo-auth-status class="authbar"></arazzo-auth-status>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Theme"></button>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" aria-controls="view-runs">Runs</button>
      <button role="tab" aria-selected="false" aria-controls="view-catalog">Catalog</button>
      <button role="tab" aria-selected="false" aria-controls="view-environments">Environments</button>
      <button role="tab" aria-selected="false" aria-controls="view-sources">Sources</button>
      <button role="tab" aria-selected="false" aria-controls="view-credentials">Credentials</button>
      <button role="tab" aria-selected="false" aria-controls="view-runners">Runners</button>
      <button role="tab" aria-selected="false" aria-controls="view-schedules">Schedules</button>
      <button role="tab" aria-selected="false" aria-controls="view-security">Security</button>
      <button role="tab" aria-selected="false" aria-controls="view-approvals">Approvals <span class="tab-badge" data-badge="approvals" hidden></span></button>
      <button role="tab" aria-selected="false" aria-controls="view-requests">Requests</button>
    </div>

    <div id="view-runs" role="tabpanel">
      <arazzo-control-plane base-url="/arazzo/v1" theme="auto" poll="4000"></arazzo-control-plane>
    </div>

    <div id="view-catalog" role="tabpanel" hidden>
      <arazzo-catalog base-url="/arazzo/v1" theme="auto"></arazzo-catalog>
    </div>

    <div id="view-environments" role="tabpanel" hidden>
      <arazzo-environments base-url="/arazzo/v1" theme="auto"></arazzo-environments>
    </div>

    <div id="view-sources" role="tabpanel" hidden>
      <arazzo-sources base-url="/arazzo/v1" theme="auto"></arazzo-sources>
    </div>

    <div id="view-credentials" role="tabpanel" hidden>
      <arazzo-credentials base-url="/arazzo/v1" theme="auto"></arazzo-credentials>
    </div>

    <div id="view-runners" role="tabpanel" hidden>
      <arazzo-runners base-url="/arazzo/v1" theme="auto" poll="8000"></arazzo-runners>
    </div>

    <div id="view-schedules" role="tabpanel" hidden>
      <arazzo-schedules base-url="/arazzo/v1" theme="auto" poll="8000"></arazzo-schedules>
    </div>

    <div id="view-security" role="tabpanel" hidden>
      <div class="subtabs" role="tablist">
        <button role="tab" aria-selected="true" aria-controls="sub-security-grants">Grants</button>
        <button role="tab" aria-selected="false" aria-controls="sub-security-rules">Rules</button>
        <button role="tab" aria-selected="false" aria-controls="sub-security-overview">Access overview</button>
      </div>
      <div id="sub-security-grants" class="subview">
        <arazzo-grants-panel base-url="/arazzo/v1" theme="auto"></arazzo-grants-panel>
      </div>
      <div id="sub-security-rules" class="subview" hidden>
        <arazzo-rules-panel base-url="/arazzo/v1" theme="auto"></arazzo-rules-panel>
      </div>
      <div id="sub-security-overview" class="subview" hidden>
        <arazzo-access-overview base-url="/arazzo/v1" theme="auto"></arazzo-access-overview>
      </div>
    </div>

    <!-- Approvals: the approver queues — work the signed-in user must action. Each sub-tab (and the primary tab) carries
         an auto-refreshing badge of outstanding Pending items so the user can see at a glance if there is work to do. -->
    <div id="view-approvals" role="tabpanel" hidden>
      <div class="subtabs" role="tablist">
        <button role="tab" aria-selected="true" aria-controls="sub-approvals-access">Workflow access <span class="tab-badge" data-badge="approvals-access" hidden></span></button>
        <button role="tab" aria-selected="false" aria-controls="sub-approvals-availability">Availability <span class="tab-badge" data-badge="approvals-availability" hidden></span></button>
        <button role="tab" aria-selected="false" aria-controls="sub-approvals-runners">Runners <span class="tab-badge" data-badge="approvals-runners" hidden></span></button>
      </div>
      <div id="sub-approvals-access" class="subview">
        <arazzo-access-requests base-url="/arazzo/v1" theme="auto" view="queue" hide-view-tabs></arazzo-access-requests>
      </div>
      <div id="sub-approvals-availability" class="subview" hidden>
        <arazzo-availability-requests base-url="/arazzo/v1" theme="auto" view="queue" hide-view-tabs></arazzo-availability-requests>
      </div>
      <div id="sub-approvals-runners" class="subview" hidden>
        <arazzo-runner-authorizations base-url="/arazzo/v1" theme="auto"></arazzo-runner-authorizations>
      </div>
    </div>

    <!-- Requests: the signed-in user's OWN outstanding requests (a different goal from approving others' work). -->
    <div id="view-requests" role="tabpanel" hidden>
      <div class="subtabs" role="tablist">
        <button role="tab" aria-selected="true" aria-controls="sub-requests-access">Workflow access</button>
        <button role="tab" aria-selected="false" aria-controls="sub-requests-availability">Availability</button>
      </div>
      <div id="sub-requests-access" class="subview">
        <arazzo-access-requests base-url="/arazzo/v1" theme="auto" view="mine" hide-view-tabs></arazzo-access-requests>
      </div>
      <div id="sub-requests-availability" class="subview" hidden>
        <arazzo-availability-requests base-url="/arazzo/v1" theme="auto" view="mine" hide-view-tabs></arazzo-availability-requests>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
