[package]
name = "corvus-json-schema-php"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "The corvus_json_schema PHP extension: the corvus-json-schema crate with PHP values read in place."
license = "Apache-2.0"
repository = "https://github.com/corvus-dotnet/Corvus.JsonSchema"
publish = false

[lib]
name = "corvus_json_schema"
crate-type = ["cdylib"]

[dependencies]
corvus = { package = "corvus-json-schema", path = "../../src-rs/corvus-json-schema", version = "0.1.3" }
ext-php-rs = "0.16.0"
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
