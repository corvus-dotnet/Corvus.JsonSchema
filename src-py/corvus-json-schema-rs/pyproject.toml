[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "corvus-json-schema-rs"
version = "0.1.3"
description = "A high-performance JSON Schema evaluator (draft 4 to 2020-12) for Python, backed by the corvus-json-schema Rust crate, with results collection and annotations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "endjin" }]
keywords = ["json-schema", "validation", "jsonschema", "validator", "draft-2020-12", "draft-2019-09", "draft-07", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: File Formats :: JSON :: JSON Schema",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/corvus-dotnet/Corvus.JsonSchema/tree/main/src-py/corvus-json-schema-rs"
Repository = "https://github.com/corvus-dotnet/Corvus.JsonSchema"
Issues = "https://github.com/corvus-dotnet/Corvus.JsonSchema/issues"

[tool.maturin]
python-source = "python"
module-name = "corvus_json_schema_rs._native"
features = ["pyo3/extension-module"]
