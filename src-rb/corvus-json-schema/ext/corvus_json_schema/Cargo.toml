[package]
name = "corvus_json_schema"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "The native extension of the corvus_json_schema gem: the corvus-json-schema crate, reading Ruby values in place."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The crate, copied in by `rake vendor` (from src-rs/corvus-json-schema) so that the source gem builds on its own.
corvus = { package = "corvus-json-schema", path = "vendor/corvus-json-schema", version = "0.1.4" }
magnus = { version = "0.9.1", features = ["rb-sys"] }
rb-sys = "0.9.130"
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
