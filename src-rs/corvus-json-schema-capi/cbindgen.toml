# Generates include/corvus_json_schema.h (CI checks the committed header is current):
#   cbindgen --config cbindgen.toml --output include/corvus_json_schema.h
language = "C"
include_guard = "CORVUS_JSON_SCHEMA_H"
cpp_compat = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
documentation_style = "c99"
style = "type"
usize_is_size_t = true
line_length = 120
header = """/* The corvus-json-schema C library: JSON Schema validation (draft 4 to 2020-12).
 *
 * Generated by cbindgen from src-rs/corvus-json-schema-capi/src/lib.rs: do not edit. See DESIGN.md for the
 * conventions: opaque handles freed by their _free function, UTF-8 strings in as (pointer, length), out as cjs_str
 * views the library owns, and a cjs_status from every fallible function (details from cjs_last_error_message). */"""

[export]
# Opaque handle types, declared but not defined.
include = ["cjs_options", "cjs_validator", "cjs_document", "cjs_collector", "cjs_resolved"]

[parse]
parse_deps = false
