[package]
name = "corvus-json-schema"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A high-performance JSON Schema evaluator (draft 4 to 2020-12) with results collection and annotations, ported from the Corvus.Text.Json V5 runtime evaluator."
license = "Apache-2.0"
repository = "https://github.com/corvus-dotnet/Corvus.JsonSchema"
homepage = "https://github.com/corvus-dotnet/Corvus.JsonSchema/tree/main/src-rs/corvus-json-schema"
readme = "README.md"
keywords = ["json-schema", "validation", "jsonschema", "validator"]
categories = ["encoding", "parser-implementations"]

[dependencies]
regex = "1.13.1"
regress = "0.12.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

[profile.bench]
codegen-units = 1
lto = "fat"
